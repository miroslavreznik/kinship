<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1d26">
  <title>Kinship: Overclock — Play</title>
  <meta name="description" content="One family. Three lifetimes. A puzzle platformer across past, present and future.">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08141b;color:#dce5df;font-family:system-ui,sans-serif}body{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}main{width:min(1280px,100%)}#frame{position:relative;aspect-ratio:16/9;background:#0d1d26;border:1px solid #31464c;border-radius:10px;overflow:hidden;box-shadow:0 16px 60px #0005}canvas{display:block;width:100%;height:100%;outline:0;image-rendering:pixelated}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:14px;background:#0d1d26;padding:24px}#status h1{margin:0;color:#edc78b;font-size:clamp(26px,5vw,48px);letter-spacing:.07em}#status p{margin:0;line-height:1.6}progress{width:min(380px,65vw);height:8px;accent-color:#d5ad70;margin:auto}footer{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:14px 2px 0;font-size:14px;color:#a0b5b7;flex-wrap:wrap}nav{display:flex;align-items:center;gap:16px}button,a{font:inherit;color:#e4c38e}button{background:#19333d;border:1px solid #49636a;border-radius:5px;padding:9px 16px;cursor:pointer}button:hover,button:focus-visible{background:#28454e;outline:2px solid #edc78b}a:focus-visible{outline:2px solid #edc78b;outline-offset:4px}#frame:fullscreen{width:100vw;height:100vh;border:0;border-radius:0;display:grid;place-items:center;background:#08141b}#frame:fullscreen canvas{width:min(100vw,177.7778vh);height:min(56.25vw,100vh)}@media(max-width:650px){body{padding:8px}footer{font-size:12px}#frame{border-radius:5px}}
  </style>
</head>
<body>
<main>
  <section id="frame" aria-label="Kinship Overclock game">
    <canvas id="canvas" width="1152" height="648" tabindex="0" aria-label="Game canvas. Keyboard controls are available in Settings.">Your browser needs WebGL 2 to play.</canvas>
    <div id="status" role="status" aria-live="polite"><h1>KINSHIP</h1><p>One family. Three lifetimes.</p><progress id="progress"></progress><p id="notice">Loading the game…</p></div>
  </section>
  <footer><span>Play with a keyboard · Progress stays in this browser</span><nav><a href="credits.html" target="_blank" rel="noopener">Credits</a><button id="fullscreen" type="button">Fullscreen</button></nav></footer>
</main>
<script src="index.js"></script>
<script>
  const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":6075452,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
  const params = new URLSearchParams(location.search);
  if (params.get('qa') === '1') {
    config.args = [...(config.args || []), '--', '--web-qa'];
    if (['2','3','4'].includes(params.get('level'))) config.args.push('--level-' + params.get('level'));
  }
  const engine = new Engine(config);
  const notice = document.getElementById('notice');
  const progress = document.getElementById('progress');
  const canvas = document.getElementById('canvas');
  document.getElementById('fullscreen').addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.getElementById('frame').requestFullscreen();
      canvas.focus();
    } catch (_) { notice.textContent = 'Use your browser’s fullscreen command.'; }
  });
  canvas.addEventListener('contextmenu', event => event.preventDefault());
  function fail(error) {
    console.error(error);
    progress.hidden = true;
    notice.textContent = 'The game could not start. Try a current desktop browser and reload this page.';
    window.kinshipLoadError = String(error);
  }
  const missing = Engine.getMissingFeatures({threads: false});
  if (missing.length) fail(missing.join(', '));
  else engine.startGame({onProgress(current,total) {
    if (total > 0) {progress.max = total; progress.value = current; notice.textContent = 'Loading the game… ' + Math.round(current / total * 100) + '%';}
  }}).then(() => {
    document.getElementById('status').remove();
    canvas.focus();
    window.kinshipLoaded = true;
  }).catch(fail);
</script>
</body>
</html>
